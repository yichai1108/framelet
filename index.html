<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="片言菲林 Framelet：刘李的文学随笔与双语阅读档案。"
    />
    <meta name="theme-color" content="#f3f1eb" />
    <title>片言菲林 Framelet</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>

    <main id="main">
      <section id="home-view" class="view" aria-labelledby="site-title">
        <header class="hero shell">
          <div class="hero-mark" aria-hidden="true">
            <img src="assets/logo.png" alt="" />
          </div>
          <div class="hero-copy">
            <p class="eyebrow">片言菲林 · FRAMELET</p>
            <h1 id="site-title">把片言，留在时光里。</h1>
            <p class="preface">
              这里收存我写下的故事与随笔。它们来自旧街、故人、动物与那些不肯轻易散去的心绪；
              像一格格菲林，在时间里显影，也等待另一个人安静地读完。
            </p>
            <p class="signature">刘李</p>
          </div>
        </header>

        <div class="archive-shell shell">
          <aside class="year-rail" aria-label="按年份浏览">
            <p class="rail-label">年志</p>
            <nav id="year-nav"></nav>
          </aside>
          <div id="archive" class="archive" aria-live="polite"></div>
        </div>

        <footer class="site-footer shell">
          <img src="assets/logo.png" alt="片言菲林 Framelet" />
          <p>文字会走远，但仍有一格光留在这里。</p>
        </footer>
      </section>

      <article id="article-view" class="view article-view" hidden>
        <header class="reader-bar">
          <button id="back-home" class="back-button" type="button">
            <span aria-hidden="true">←</span> 返回主页
          </button>
          <div class="reader-brand">
            <img src="assets/logo.png" alt="" />
            <span>FRAMELET</span>
          </div>
        </header>

        <div class="reader-shell shell">
          <header class="article-heading">
            <p id="article-date" class="article-date"></p>
            <h1 id="article-title"></h1>
            <p id="article-title-en" class="article-title-en" lang="en"></p>
          </header>

          <figure id="article-image-wrap" class="article-image-wrap" hidden>
            <img id="article-image" src="" alt="" />
            <figcaption id="article-caption"></figcaption>
          </figure>

          <div class="mobile-language-tabs" aria-label="切换阅读语言">
            <button type="button" data-language="en" class="is-active">English</button>
            <button type="button" data-language="zh">中文原文</button>
          </div>

          <div class="parallel-text">
            <section class="language-column english-column" data-language-panel="en" aria-labelledby="english-label">
              <div class="column-label" id="english-label">
                <span>EN</span>
                <p>English Translation</p>
              </div>
              <div id="english-text" class="prose" lang="en"></div>
            </section>
            <section class="language-column chinese-column" data-language-panel="zh" aria-labelledby="chinese-label">
              <div class="column-label" id="chinese-label">
                <span>中</span>
                <p>中文原文</p>
              </div>
              <div id="chinese-text" class="prose"></div>
            </section>
          </div>

          <footer class="article-end">
            <span aria-hidden="true">※</span>
            <button id="back-home-bottom" class="text-button" type="button">读完了，返回主页</button>
          </footer>
        </div>
      </article>
    </main>

    <script src="content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
